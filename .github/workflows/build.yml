name: Build OpenWRT Package (Full SDK)

on:
  # Manual trigger only - use for releases
  workflow_dispatch:
  # Auto-trigger on version tags
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build IPK Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - name: aarch64_cortex-a53
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/bcm27xx/bcm2710/openwrt-sdk-23.05.3-bcm27xx-bcm2710_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - name: arm_cortex-a9
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/bcm53xx/generic/openwrt-sdk-23.05.3-bcm53xx-generic_gcc-12.3.0_musl_eabi.Linux-x86_64.tar.xz
          - name: mipsel_24kc
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7621/openwrt-sdk-23.05.3-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext zlib1g-dev swig unzip time rsync python3
      
      - name: Cache OpenWRT SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: openwrt-sdk.tar.xz
          key: sdk-${{ matrix.arch.name }}-23.05.3
      
      - name: Download OpenWRT SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          wget --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 10 \
            --progress=dot:giga -O openwrt-sdk.tar.xz ${{ matrix.arch.sdk_url }}
      
      - name: Extract SDK
        timeout-minutes: 5
        run: |
          tar xf openwrt-sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk
      
      - name: Copy package to SDK
        run: |
          cp -r ezwol openwrt-sdk/package/
      
      - name: Update feeds
        timeout-minutes: 10
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Configure build
        timeout-minutes: 5
        working-directory: openwrt-sdk
        run: |
          echo "CONFIG_PACKAGE_ezwol=m" >> .config
          make defconfig V=s
      
      - name: Build package
        timeout-minutes: 20
        working-directory: openwrt-sdk
        run: |
          make package/ezwol/compile V=s -j$(nproc)
      
      - name: Find IPK files
        id: find_ipk
        working-directory: openwrt-sdk
        run: |
          IPK_FILE=$(find bin/packages -name "ezwol_*.ipk" | head -n 1)
          echo "ipk_file=$IPK_FILE" >> $GITHUB_OUTPUT
          echo "ipk_name=$(basename $IPK_FILE)" >> $GITHUB_OUTPUT
          echo "Found IPK: $IPK_FILE"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezwol-${{ matrix.arch.name }}
          path: openwrt-sdk/${{ steps.find_ipk.outputs.ipk_file }}
          if-no-files-found: error
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: openwrt-sdk/${{ steps.find_ipk.outputs.ipk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
